<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mes commandes — Marketplace</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="header"></div>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <h1 id="pageTitle">Mes commandes</h1>
          <p class="subtitle" id="subtitle">Historique de vos achats</p>
        </div>
      </div>

      <div id="orders"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script type="module">
    import { api, formatPrice } from '/js/api.js';
    import { renderHeader } from '/js/header.js';
    import { renderFooter } from '/js/footer.js';

    await renderHeader();
    renderFooter();

    const container = document.getElementById('orders');
    const subtitle = document.getElementById('subtitle');
    const pageTitle = document.getElementById('pageTitle');

    let me;
    try { me = await api.get('/auth/me'); } catch { location.href = '/login.html'; }

    if (me.role === 'VENDOR') {
      pageTitle.textContent = 'Commandes reçues';
      subtitle.textContent = 'Commandes passées sur votre boutique';
    }

    const STATUS = {
      PENDING:   { label: 'En attente',  color: '#71717a', bg: '#f4f4f5' },
      PAID:      { label: 'Payée',       color: '#166534', bg: '#dcfce7' },
      SHIPPED:   { label: 'Expédiée',    color: '#1e40af', bg: '#dbeafe' },
      DELIVERED: { label: 'Livrée',      color: '#166534', bg: '#dcfce7' },
      CANCELLED: { label: 'Annulée',     color: '#991b1b', bg: '#fee2e2' },
      REFUNDED:  { label: 'Remboursée',  color: '#71717a', bg: '#f4f4f5' },
    };

    try {
      const orders = await api.get('/orders');

      if (!orders.length) {
        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">📦</div>
            <h2 style="margin-bottom:8px">Aucune commande</h2>
            <p class="muted">${me.role === 'VENDOR' ? 'Vous n\'avez pas encore reçu de commande.' : 'Vous n\'avez pas encore passé de commande.'}</p>
            ${me.role === 'CLIENT' ? `<a href="/products.html" class="btn btn-primary btn-lg" style="margin-top:20px">Découvrir les produits</a>` : ''}
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map(o => {
        const st = STATUS[o.status] || STATUS.PENDING;
        const date = new Date(o.createdAt).toLocaleDateString('fr-FR', {
          day: 'numeric', month: 'long', year: 'numeric',
        });

        const commissionTotal = o.items.reduce((s, i) => s + (i.commission || 0), 0);
        const net = o.total - commissionTotal;

        return `
          <div class="order-card">
            <div class="order-head">
              <div>
                <div class="order-id">Commande <strong>#${o.id.slice(-8)}</strong></div>
                <div class="order-date">${date}</div>
                ${me.role === 'VENDOR' && o.client ? `<div class="order-client">👤 ${o.client.name} — ${o.client.email}</div>` : ''}
              </div>
              <div class="order-head-right">
                <span class="order-status" style="color:${st.color};background:${st.bg}">${st.label}</span>
                <div class="order-total">${formatPrice(o.total)}</div>
                ${me.role === 'VENDOR' ? `
                  <div class="order-commission">Commission : ${formatPrice(commissionTotal)}</div>
                  <div class="order-net">Net : ${formatPrice(net)}</div>
                ` : ''}
              </div>
            </div>

            <div class="order-items">
              ${o.items.map(i => `
                <div class="order-item">
                  <img src="${i.product?.imageUrl || 'https://picsum.photos/seed/' + i.productId + '/80'}"
                       alt="${i.product?.title || ''}" />
                  <div class="order-item-info">
                    <a href="/product.html?id=${i.productId}" class="order-item-title">${i.product?.title || 'Produit supprimé'}</a>
                    <div class="order-item-qty">Quantité : ${i.quantity} × ${formatPrice(i.unitPrice)}</div>
                  </div>
                  <div class="order-item-total">${formatPrice(i.unitPrice * i.quantity)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    } catch (e) {
      container.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
    }
  </script>
</body>
</html>
