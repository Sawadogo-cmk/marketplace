<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — Marketplace</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="header"></div>

  <div class="auth-container">
    <div class="auth-card">
      <h1 id="formTitle">Connexion</h1>
      <p class="subtitle" id="formSubtitle">Accédez à votre compte</p>

      <div class="tabs">
        <button id="tabLogin" class="active">Connexion</button>
        <button id="tabRegister">Inscription</button>
      </div>

      <div id="alert"></div>

      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" name="email" placeholder="vous@exemple.com" required />
        </div>
        <div class="field">
          <label for="loginPassword">Mot de passe</label>
          <input id="loginPassword" type="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Se connecter</button>
      </form>

      <form id="registerForm" style="display:none">
        <div class="field">
          <label for="regName">Nom complet</label>
          <input id="regName" type="text" name="name" placeholder="Jean Dupont" required />
        </div>
        <div class="field">
          <label for="regEmail">Email</label>
          <input id="regEmail" type="email" name="email" placeholder="vous@exemple.com" required />
        </div>
        <div class="field">
          <label for="regPassword">Mot de passe</label>
          <input id="regPassword" type="password" name="password" placeholder="6 caractères minimum" required minlength="6" />
        </div>
        <div class="field">
          <label for="roleSelect">Type de compte</label>
          <select name="role" id="roleSelect">
            <option value="CLIENT">🛒 Client — je veux acheter</option>
            <option value="VENDOR">🏪 Vendeur — je veux vendre</option>
          </select>
        </div>
        <div class="field" id="shopNameWrap" style="display:none">
          <label for="regShop">Nom de la boutique</label>
          <input id="regShop" type="text" name="shopName" placeholder="Ma super boutique" />
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Créer mon compte</button>
      </form>
    </div>
  </div>

  <div id="footer"></div>

  <script type="module">
    import { api, showAlert } from '/js/api.js';
    import { renderHeader } from '/js/header.js';
    import { renderFooter } from '/js/footer.js';

    await renderHeader();
    renderFooter();

    const alertBox = document.getElementById('alert');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const roleSelect = document.getElementById('roleSelect');
    const shopNameWrap = document.getElementById('shopNameWrap');
    const formTitle = document.getElementById('formTitle');
    const formSubtitle = document.getElementById('formSubtitle');

    tabLogin.onclick = () => {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      loginForm.style.display = 'flex';
      registerForm.style.display = 'none';
      formTitle.textContent = 'Connexion';
      formSubtitle.textContent = 'Accédez à votre compte';
      alertBox.innerHTML = '';
    };

    tabRegister.onclick = () => {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      registerForm.style.display = 'flex';
      loginForm.style.display = 'none';
      formTitle.textContent = 'Créer un compte';
      formSubtitle.textContent = 'Rejoignez la marketplace en quelques secondes';
      alertBox.innerHTML = '';
    };

    roleSelect.onchange = () => {
      shopNameWrap.style.display = roleSelect.value === 'VENDOR' ? 'flex' : 'none';
    };

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      const btn = loginForm.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Connexion…';
      const fd = new FormData(loginForm);
      try {
        await api.post('/auth/login', {
          email: fd.get('email'),
          password: fd.get('password'),
        });
        showAlert(alertBox, 'Connecté, redirection…', 'success');
        setTimeout(() => location.href = '/', 500);
      } catch (err) {
        showAlert(alertBox, err.message);
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    };

    registerForm.onsubmit = async (e) => {
      e.preventDefault();
      const btn = registerForm.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Création…';
      const fd = new FormData(registerForm);
      try {
        await api.post('/auth/register', {
          name: fd.get('name'),
          email: fd.get('email'),
          password: fd.get('password'),
          role: fd.get('role'),
          shopName: fd.get('shopName') || undefined,
        });
        showAlert(alertBox, 'Compte créé, redirection…', 'success');
        setTimeout(() => location.href = '/', 600);
      } catch (err) {
        showAlert(alertBox, err.message);
        btn.disabled = false;
        btn.textContent = 'Créer mon compte';
      }
    };
  </script>
</body>
</html>
