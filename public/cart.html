<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panier — Marketplace</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="header"></div>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Mon panier</h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <a href="/products.html" class="btn">← Continuer mes achats</a>
      </div>

      <div id="alert"></div>
      <div id="cart"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script type="module">
    import { api, formatPrice, showAlert } from '/js/api.js';
    import { getCart, setQuantity, removeFromCart, clearCart } from '/js/cart.js';
    import { renderHeader } from '/js/header.js';
    import { renderFooter } from '/js/footer.js';

    await renderHeader();
    renderFooter();

    const container = document.getElementById('cart');
    const alertBox = document.getElementById('alert');
    const subtitle = document.getElementById('subtitle');

    let me = null;
    try { me = await api.get('/auth/me'); } catch {}

    async function render() {
      const cart = getCart();

      if (!cart.length) {
        subtitle.textContent = '';
        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🛒</div>
            <h2 style="margin-bottom:8px">Votre panier est vide</h2>
            <p class="muted">Ajoutez des produits pour commencer vos achats.</p>
            <a href="/products.html" class="btn btn-primary btn-lg" style="margin-top:20px">Explorer le catalogue</a>
          </div>
        `;
        return;
      }

      const products = await Promise.all(
        cart.map(i => api.get(`/products/${i.productId}`).catch(() => null))
      );

      const items = cart
        .map((item, idx) => {
          const p = products[idx];
          if (!p) return null;
          return { ...item, product: p };
        })
        .filter(Boolean);

      if (!items.length) {
        container.innerHTML = `<div class="alert alert-error">Les produits de votre panier ne sont plus disponibles.</div>`;
        return;
      }

      const totalQty = items.reduce((s, i) => s + i.quantity, 0);
      const subtotal = items.reduce((s, i) => s + i.product.price * i.quantity, 0);
      const shipping = 0;

      subtitle.textContent = `${totalQty} article${totalQty > 1 ? 's' : ''} dans votre panier`;

      container.innerHTML = `
        <div class="cart-layout">
          <div>
            ${items.map(i => `
              <div class="cart-item">
                <a href="/product.html?id=${i.productId}">
                  <img src="${i.product.imageUrl || 'https://picsum.photos/seed/' + i.productId + '/200'}"
                       alt="${i.product.title}" />
                </a>
                <div>
                  <a href="/product.html?id=${i.productId}" class="cart-item-title">${i.product.title}</a>
                  <div class="cart-item-vendor">🏪 ${i.product.vendor?.shopName || ''}</div>
                  <div class="cart-item-price">${formatPrice(i.product.price)}</div>
                </div>
                <div class="qty">
                  <button data-action="dec" data-id="${i.productId}" aria-label="Diminuer">−</button>
                  <span>${i.quantity}</span>
                  <button data-action="inc" data-id="${i.productId}" aria-label="Augmenter">+</button>
                </div>
                <div style="text-align:right">
                  <div class="cart-item-total">${formatPrice(i.product.price * i.quantity)}</div>
                  <button class="btn btn-danger btn-xs" data-action="del" data-id="${i.productId}">Retirer</button>
                </div>
              </div>
            `).join('')}

            <div class="cart-actions">
              <button class="btn" id="clearBtn">Vider le panier</button>
            </div>
          </div>

          <aside class="cart-summary-box">
            <h2 style="margin-bottom:20px;font-size:18px">Récapitulatif</h2>

            <div class="summary-row">
              <span>Sous-total (${totalQty} article${totalQty > 1 ? 's' : ''})</span>
              <span>${formatPrice(subtotal)}</span>
            </div>
            <div class="summary-row">
              <span>Livraison</span>
              <span style="color:var(--success);font-weight:600">Gratuite</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span>${formatPrice(subtotal + shipping)}</span>
            </div>

            <button class="btn btn-primary btn-lg btn-block" id="checkoutBtn" style="margin-top:20px">
              ${me ? 'Passer commande →' : 'Se connecter pour commander'}
            </button>

            ${!me ? `<p class="muted" style="text-align:center;margin-top:12px;font-size:12.5px">
              Vous serez redirigé pour vous connecter
            </p>` : ''}

            <div class="payment-badges">
              <div class="payment-badge">🔒 Paiement sécurisé</div>
              <div class="payment-badge">💳 Stripe</div>
            </div>
          </aside>
        </div>
      `;

      // Actions quantité
      container.querySelectorAll('button[data-action]').forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.id;
          const item = items.find(i => i.productId === id);
          if (!item) return;
          if (btn.dataset.action === 'inc') setQuantity(id, item.quantity + 1);
          if (btn.dataset.action === 'dec') setQuantity(id, item.quantity - 1);
          if (btn.dataset.action === 'del') removeFromCart(id);
          render();
        };
      });

      // Vider
      document.getElementById('clearBtn').onclick = () => {
        if (confirm('Vider le panier ?')) { clearCart(); render(); }
      };

      // Commander
      document.getElementById('checkoutBtn').onclick = async () => {
        if (!me) { location.href = '/login.html'; return; }

        const btn = document.getElementById('checkoutBtn');
        btn.disabled = true;
        btn.textContent = 'Création de la commande…';

        try {
          const order = await api.post('/orders', {
            items: items.map(i => ({
              productId: i.productId,
              quantity: i.quantity,
            })),
          });

          btn.textContent = 'Redirection vers le paiement…';
          const { url } = await api.post('/stripe/checkout', { orderId: order.id });

          clearCart();
          location.href = url;
        } catch (e) {
          showAlert(alertBox, e.message);
          btn.disabled = false;
          btn.textContent = 'Passer commande →';
        }
      };
    }

    render();
  </script>
</body>
</html>
