<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panier — Marketplace</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="header"></div>
  <main>
    <h1>Mon panier</h1>
    <div id="cart"></div>
  </main>

  <script type="module">
    import { api, formatPrice } from '/js/api.js';
    import { getCart, setQuantity, removeFromCart, clearCart } from '/js/cart.js';
    import { renderHeader } from '/js/header.js';

    await renderHeader();

    const container = document.getElementById('cart');

    async function render() {
      const cart = getCart();
      if (!cart.length) {
        container.innerHTML = `<p class="empty">Votre panier est vide. <a href="/products.html">Voir les produits</a></p>`;
        return;
      }

      // Charger tous les produits du panier
      const products = await Promise.all(
        cart.map(i => api.get(`/products/${i.productId}`).catch(() => null))
      );

      const items = cart.map((item, idx) => {
        const p = products[idx];
        if (!p) return null;
        return { ...item, product: p };
      }).filter(Boolean);

      const total = items.reduce((s, i) => s + i.product.price * i.quantity, 0);

      container.innerHTML = `
        <div class="cart-list">
          ${items.map(i => `
            <div class="cart-item">
              <img src="${i.product.imageUrl || 'https://via.placeholder.com/80'}" alt="${i.product.title}" />
              <div>
                <h3>${i.product.title}</h3>
                <p class="muted">${i.product.vendor?.shopName || ''}</p>
                <p class="price" style="color:var(--primary);font-weight:700">${formatPrice(i.product.price)}</p>
              </div>
              <div class="qty">
                <button data-action="dec" data-id="${i.productId}">−</button>
                <span>${i.quantity}</span>
                <button data-action="inc" data-id="${i.productId}">+</button>
              </div>
              <button class="btn btn-danger" data-action="del" data-id="${i.productId}">✕</button>
            </div>
          `).join('')}
        </div>

        <div class="cart-summary">
          <div>
            <p class="muted">Total (${items.reduce((s,i)=>s+i.quantity,0)} article(s))</p>
            <p class="total">${formatPrice(total)}</p>
          </div>
          <div class="flex">
            <button class="btn" id="clearBtn">Vider</button>
            <button class="btn btn-primary" id="checkoutBtn">Commander</button>
          </div>
        </div>
      `;

      container.querySelectorAll('button[data-action]').forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.id;
          const item = items.find(i => i.productId === id);
          if (btn.dataset.action === 'inc') setQuantity(id, item.quantity + 1);
          if (btn.dataset.action === 'dec') setQuantity(id, item.quantity - 1);
          if (btn.dataset.action === 'del') removeFromCart(id);
          render();
        };
      });

      document.getElementById('clearBtn').onclick = () => {
        if (confirm('Vider le panier ?')) { clearCart(); render(); }
      };

      document.getElementById('checkoutBtn').onclick = () => {
        alert('Étape suivante : paiement Stripe (à venir)');
      };
    }

    render();
  </script>
</body>
</html>
