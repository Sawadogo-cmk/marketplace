<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panier — Marketplace</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="header"></div>
  <main>
    <div class="page-head">
      <div>
        <h1>Mon panier</h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
      <a href="/products.html" class="btn">← Continuer mes achats</a>
    </div>

    <div id="alert"></div>
    <div id="cart"></div>
  </main>

  <script type="module">
    import { api, formatPrice, showAlert } from '/js/api.js';
    import { getCart, setQuantity, removeFromCart, clearCart } from '/js/cart.js';
    import { renderHeader } from '/js/header.js';

    await renderHeader();

    const container = document.getElementById('cart');
    const alertBox = document.getElementById('alert');
    const subtitle = document.getElementById('subtitle');

    // Vérifier connexion
    let me = null;
    try { me = await api.get('/auth/me'); } catch {}

    async function render() {
      const cart = getCart();

      if (!cart.length) {
        subtitle.textContent = '';
        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🛒</div>
            <p>Votre panier est vide</p>
            <p class="muted mt-2"><a href="/products.html">Parcourir les produits →</a></p>
          </div>
        `;
        return;
      }

      // Charger les produits du panier
      const products = await Promise.all(
        cart.map(i => api.get(`/products/${i.productId}`).catch(() => null))
      );

      const items = cart
        .map((item, idx) => {
          const p = products[idx];
          if (!p) return null;
          return { ...item, product: p };
        })
        .filter(Boolean);

      if (!items.length) {
        container.innerHTML = `<div class="alert alert-error">Les produits de votre panier ne sont plus disponibles.</div>`;
        return;
      }

      const totalQty = items.reduce((s, i) => s + i.quantity, 0);
      const total = items.reduce((s, i) => s + i.product.price * i.quantity, 0);

      subtitle.textContent = `${totalQty} article${totalQty > 1 ? 's' : ''} dans votre panier`;

      container.innerHTML = `
        <div class="cart-list">
          ${items.map(i => `
            <div class="cart-item">
              <img src="${i.product.imageUrl || 'https://picsum.photos/seed/' + i.productId + '/160'}"
                   alt="${i.product.title}" />
              <div>
                <h3>${i.product.title}</h3>
                <p class="muted">${i.product.vendor?.shopName || ''}</p>
                <p style="color:var(--black);font-weight:600;font-size:15px;margin-top:4px">
                  ${formatPrice(i.product.price)}
                </p>
              </div>
              <div class="qty">
                <button data-action="dec" data-id="${i.productId}" aria-label="Diminuer">−</button>
                <span>${i.quantity}</span>
                <button data-action="inc" data-id="${i.productId}" aria-label="Augmenter">+</button>
              </div>
              <button class="btn btn-danger" data-action="del" data-id="${i.productId}" title="Retirer">✕</button>
            </div>
          `).join('')}
        </div>

        <div class="cart-summary">
          <div>
            <p class="muted" style="margin-bottom:2px">Total</p>
            <p class="total">${formatPrice(total)}</p>
          </div>
          <div class="flex">
            <button class="btn" id="clearBtn">Vider le panier</button>
            <button class="btn btn-primary btn-lg" id="checkoutBtn">
              ${me ? 'Commander' : 'Se connecter pour commander'}
            </button>
          </div>
        </div>
      `;

      // Boutons quantité / suppression
      container.querySelectorAll('button[data-action]').forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.id;
          const item = items.find(i => i.productId === id);
          if (!item) return;

          if (btn.dataset.action === 'inc') setQuantity(id, item.quantity + 1);
          if (btn.dataset.action === 'dec') setQuantity(id, item.quantity - 1);
          if (btn.dataset.action === 'del') removeFromCart(id);
          render();
        };
      });

      // Vider le panier
      document.getElementById('clearBtn').onclick = () => {
        if (confirm('Vider le panier ?')) {
          clearCart();
          render();
        }
      };

      // Commande
      document.getElementById('checkoutBtn').onclick = async () => {
        // 1. Vérifier connexion
        if (!me) {
          location.href = '/login.html';
          return;
        }

        // 2. Confirmer
        if (!confirm(`Confirmer la commande de ${formatPrice(total)} ?`)) return;

        const btn = document.getElementById('checkoutBtn');
        btn.disabled = true;
        btn.textContent = 'Traitement…';

        try {
          const body = {
            items: items.map(i => ({
              productId: i.productId,
              quantity: i.quantity,
            })),
          };

          const order = await api.post('/orders', body);
          clearCart();

          showAlert(alertBox, `✓ Commande #${order.id.slice(-8)} créée avec succès !`, 'success');

          setTimeout(() => {
            location.href = '/orders.html';
          }, 1000);
        } catch (e) {
          showAlert(alertBox, e.message);
          btn.disabled = false;
          btn.textContent = 'Commander';
        }
      };
    }

    render();
  </script>
</body>
</html>
