<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ma boutique — Marketplace</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="header"></div>
  <main>
    <div class="page-head">
      <div>
        <h1>Ma boutique</h1>
        <p class="subtitle" id="shopName"></p>
      </div>
      <a href="/products.html" class="btn">Voir la boutique →</a>
    </div>

    <div class="panel" id="stripeStatus" style="margin-bottom:24px;display:none">
      <div class="flex-between" style="gap:16px;flex-wrap:wrap">
        <div>
          <h2>💳 Paiements Stripe</h2>
          <p class="muted mt-2" id="stripeMessage">Chargement…</p>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-primary" id="stripeBtn" style="display:none">Activer mes paiements</button>
          <button class="btn" id="stripeDashBtn" style="display:none">Ouvrir mon dashboard Stripe</button>
        </div>
      </div>
    </div>

    <div id="alert"></div>

    <div class="vendor-grid">
      <div class="panel">
        <div class="panel-head">
          <h2>Nouveau produit</h2>
        </div>
        <form id="productForm">
          <div class="field">
            <label for="pTitle">Titre</label>
            <input id="pTitle" type="text" name="title" placeholder="T-shirt noir" required />
          </div>
          <div class="field">
            <label for="pDesc">Description</label>
            <textarea id="pDesc" name="description" placeholder="Description du produit…" required></textarea>
          </div>
          <div class="flex gap-2">
            <div class="field" style="flex:1">
              <label for="pPrice">Prix (FCFA)</label>
              <input id="pPrice" type="number" name="price" step="1" min="0" placeholder="25000" required />
              <span class="hint" id="pricePreview"></span>
            </div>
            <div class="field" style="flex:1">
              <label for="pStock">Stock</label>
              <input id="pStock" type="number" name="stock" min="0" value="1" />
            </div>
          </div>
          <div class="field">
            <label for="pCategory">Catégorie</label>
            <input id="pCategory" type="text" name="category" placeholder="mode, tech, maison…" />
          </div>
          <div class="field">
            <label for="pImage">Photo</label>
            <input id="pImage" type="file" name="image" accept="image/*" />
            <span class="hint">JPG, PNG ou WebP — 3 Mo max</span>
            <div id="preview" class="mt-2"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">Publier</button>
        </form>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Mes produits</h2>
          <span class="muted" id="productCount"></span>
        </div>
        <div id="productsList">
          <p class="empty">Chargement…</p>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { api, formatPrice, showAlert } from '/js/api.js';
    import { renderHeader } from '/js/header.js';

    await renderHeader('vendor');

    const alertBox = document.getElementById('alert');
    const list = document.getElementById('productsList');
    const form = document.getElementById('productForm');
    const preview = document.getElementById('preview');
    const shopNameEl = document.getElementById('shopName');
    const countEl = document.getElementById('productCount');
    const priceInput = document.getElementById('pPrice');
    const pricePreview = document.getElementById('pricePreview');

    let me;
    try { me = await api.get('/auth/me'); } catch { location.href = '/login.html'; }
    if (!me || me.role !== 'VENDOR') location.href = '/login.html';

    shopNameEl.textContent = me.vendor.shopName;

    // ---- Stripe Connect ----
    const stripeStatusEl = document.getElementById('stripeStatus');
    const stripeMessage = document.getElementById('stripeMessage');
    const stripeBtn = document.getElementById('stripeBtn');
    const stripeDashBtn = document.getElementById('stripeDashBtn');

    async function loadStripeStatus() {
      stripeStatusEl.style.display = 'block';
      try {
        const s = await api.get('/connect/status');

        if (!s.connected) {
          stripeMessage.innerHTML = '⚠️ Activez vos paiements pour vendre sur la marketplace.';
          stripeBtn.textContent = 'Activer mes paiements';
          stripeBtn.style.display = 'inline-flex';
          stripeDashBtn.style.display = 'none';
          return;
        }

        if (s.status === 'ACTIVE') {
          stripeMessage.innerHTML = '✅ <strong>Compte actif</strong> — Vous recevez automatiquement vos paiements.';
          stripeDashBtn.style.display = 'inline-flex';
          stripeBtn.style.display = 'none';
        } else if (s.detailsSubmitted) {
          stripeMessage.innerHTML = '⏳ <strong>Vérification en cours</strong> — Stripe examine vos informations.';
          stripeBtn.textContent = 'Compléter mes informations';
          stripeBtn.style.display = 'inline-flex';
          stripeDashBtn.style.display = 'none';
        } else {
          stripeMessage.innerHTML = '⚠️ Complétez votre inscription Stripe pour activer les paiements.';
          stripeBtn.textContent = 'Activer mes paiements';
          stripeBtn.style.display = 'inline-flex';
          stripeDashBtn.style.display = 'none';
        }
      } catch (e) {
        stripeMessage.textContent = 'Erreur : ' + e.message;
      }
    }

    stripeBtn.onclick = async () => {
      try {
        const { url } = await api.post('/connect/onboard');
        location.href = url;
      } catch (e) {
        showAlert(alertBox, e.message);
      }
    };

    stripeDashBtn.onclick = async () => {
      try {
        const { url } = await api.post('/connect/dashboard');
        window.open(url, '_blank');
      } catch (e) {
        showAlert(alertBox, e.message);
      }
    };

    loadStripeStatus();

    const params = new URLSearchParams(location.search);
    if (params.get('stripe') === 'ok') {
      showAlert(alertBox, '✓ Informations enregistrées. Vérification en cours par Stripe.', 'success');
      setTimeout(loadStripeStatus, 1500);
    }
    if (params.get('stripe') === 'refresh') {
      showAlert(alertBox, 'Session expirée, veuillez réessayer.', 'error');
    }

    // ---- Produits ----
    priceInput.oninput = () => {
      const v = parseInt(priceInput.value);
      pricePreview.textContent = v > 0
        ? `= ${new Intl.NumberFormat('fr-FR').format(v)} FCFA`
        : '';
    };

    const fileInput = form.querySelector('input[name="image"]');
    fileInput.onchange = () => {
      preview.innerHTML = '';
      const file = fileInput.files[0];
      if (!file) return;
      if (file.size > 3 * 1024 * 1024) {
        showAlert(alertBox, 'Image trop lourde (3 Mo max)');
        fileInput.value = '';
        return;
      }
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    };

    async function loadProducts() {
      const products = await api.get(`/products?vendorId=${me.vendor.id}`);
      countEl.textContent = products.length
        ? `${products.length} produit${products.length > 1 ? 's' : ''}`
        : '';

      if (!products.length) {
        list.innerHTML = `
          <div class="empty">
            <div class="empty-icon">📦</div>
            <p>Aucun produit pour le moment</p>
          </div>
        `;
        return;
      }

      list.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:60px"></th>
                <th>Produit</th>
                <th>Prix</th>
                <th>Stock</th>
                <th style="width:80px"></th>
              </tr>
            </thead>
            <tbody>
              ${products.map(p => `
                <tr>
                  <td>
                    <img class="thumb"
                         src="${p.imageUrl || 'https://picsum.photos/seed/' + p.id + '/80'}"
                         alt="${p.title}" />
                  </td>
                  <td>
                    <div style="font-weight:500">${p.title}</div>
                    ${p.category ? `<div class="muted" style="font-size:12px">${p.category}</div>` : ''}
                  </td>
                  <td>${formatPrice(p.price)}</td>
                  <td>${p.stock}</td>
                  <td>
                    <button class="btn btn-danger" data-id="${p.id}" style="padding:5px 10px;font-size:12.5px">Supprimer</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      list.querySelectorAll('button[data-id]').forEach(btn => {
        btn.onclick = async () => {
          if (!confirm('Supprimer ce produit ?')) return;
          try {
            await api.delete(`/products/${btn.dataset.id}`);
            loadProducts();
          } catch (e) { showAlert(alertBox, e.message); }
        };
      });
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Envoi…';

      try {
        let imageUrl = null;
        const file = fileInput.files[0];
        if (file) {
          const fdImg = new FormData();
          fdImg.append('image', file);
          const res = await fetch('/api/upload', {
            method: 'POST',
            body: fdImg,
            credentials: 'include',
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Erreur upload');
          imageUrl = data.url;
        }

        const fd = new FormData(form);
        await api.post('/products', {
          title: fd.get('title'),
          description: fd.get('description'),
          price: parseInt(fd.get('price')),
          stock: parseInt(fd.get('stock') || 0),
          category: fd.get('category') || null,
          imageUrl,
        });

        showAlert(alertBox, '✓ Produit créé', 'success');
        form.reset();
        preview.innerHTML = '';
        pricePreview.textContent = '';
        loadProducts();
      } catch (e) {
        showAlert(alertBox, e.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Publier';
      }
    };

    loadProducts();
  </script>
</body>
</html>
