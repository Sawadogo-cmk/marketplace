<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ma boutique — Marketplace</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="header"></div>

  <main>
    <div class="container">
      <!-- En-tête -->
      <div class="page-head">
        <div>
          <h1 id="shopName">Ma boutique</h1>
          <p class="subtitle" id="shopStats"></p>
        </div>
        <a href="/products.html" class="btn">Voir la boutique publique →</a>
      </div>

      <!-- Panneau Stripe -->
      <div class="stripe-panel" id="stripeStatus" style="display:none">
        <div class="stripe-panel-left">
          <div class="stripe-icon">💳</div>
          <div>
            <div class="stripe-panel-title">Paiements Stripe</div>
            <div class="stripe-panel-msg" id="stripeMessage">Chargement…</div>
          </div>
        </div>
        <div class="stripe-panel-actions">
          <button class="btn btn-primary" id="stripeBtn" style="display:none">Activer mes paiements</button>
          <button class="btn" id="stripeDashBtn" style="display:none">Ouvrir le dashboard Stripe</button>
        </div>
      </div>

      <div id="alert"></div>

      <!-- Stats -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- Layout 2 colonnes -->
      <div class="vendor-layout">
        <!-- Formulaire -->
        <div class="panel">
          <div class="panel-head">
            <h2>➕ Nouveau produit</h2>
          </div>
          <form id="productForm">
            <div class="field">
              <label for="pTitle">Titre</label>
              <input id="pTitle" type="text" name="title" placeholder="Ex : Robe wax élégante" required />
            </div>

            <div class="field">
              <label for="pDesc">Description</label>
              <textarea id="pDesc" name="description" placeholder="Décrivez votre produit…" required></textarea>
            </div>

            <div class="flex gap-2">
              <div class="field" style="flex:1">
                <label for="pPrice">Prix (FCFA)</label>
                <input id="pPrice" type="number" name="price" step="1" min="0" placeholder="25000" required />
                <span class="hint" id="pricePreview"></span>
              </div>
              <div class="field" style="flex:1">
                <label for="pStock">Stock</label>
                <input id="pStock" type="number" name="stock" min="0" value="1" />
              </div>
            </div>

            <div class="field">
              <label for="pCategory">Catégorie</label>
              <select id="pCategory" name="category">
                <option value="">— Aucune —</option>
                <option value="mode">👗 Mode</option>
                <option value="tech">📱 Tech</option>
                <option value="maison">🏠 Maison</option>
                <option value="sport">⚽ Sport</option>
                <option value="beaute">💄 Beauté</option>
              </select>
            </div>

            <div class="field">
              <label for="pImage">Photo</label>
              <input id="pImage" type="file" name="image" accept="image/*" />
              <span class="hint">JPG, PNG ou WebP — 3 Mo max</span>
              <div id="preview" class="mt-2"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block">Publier le produit</button>
          </form>
        </div>

        <!-- Liste produits -->
        <div class="panel">
          <div class="panel-head">
            <h2>📦 Mes produits</h2>
            <span class="muted" id="productCount"></span>
          </div>
          <div id="productsList">
            <p class="empty">Chargement…</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script type="module">
    import { api, formatPrice, showAlert } from '/js/api.js';
    import { renderHeader } from '/js/header.js';
    import { renderFooter } from '/js/footer.js';

    await renderHeader('vendor');
    renderFooter();

    const alertBox = document.getElementById('alert');
    const list = document.getElementById('productsList');
    const form = document.getElementById('productForm');
    const preview = document.getElementById('preview');
    const shopNameEl = document.getElementById('shopName');
    const shopStats = document.getElementById('shopStats');
    const countEl = document.getElementById('productCount');
    const priceInput = document.getElementById('pPrice');
    const pricePreview = document.getElementById('pricePreview');
    const statsGrid = document.getElementById('statsGrid');

    let me;
    try { me = await api.get('/auth/me'); } catch { location.href = '/login.html'; }
    if (!me || me.role !== 'VENDOR') location.href = '/login.html';

    shopNameEl.textContent = me.vendor.shopName;

    // ---- Stripe Connect ----
    const stripeStatusEl = document.getElementById('stripeStatus');
    const stripeMessage = document.getElementById('stripeMessage');
    const stripeBtn = document.getElementById('stripeBtn');
    const stripeDashBtn = document.getElementById('stripeDashBtn');

    async function loadStripeStatus() {
      stripeStatusEl.style.display = 'flex';
      try {
        const s = await api.get('/connect/status');

        if (!s.connected) {
          stripeMessage.innerHTML = '⚠️ Activez vos paiements pour vendre sur la marketplace.';
          stripeBtn.textContent = 'Activer mes paiements';
          stripeBtn.style.display = 'inline-flex';
          stripeDashBtn.style.display = 'none';
          return;
        }

        if (s.status === 'ACTIVE') {
          stripeMessage.innerHTML = '✅ <strong>Compte actif</strong> — Vous recevez vos paiements automatiquement.';
          stripeDashBtn.style.display = 'inline-flex';
          stripeBtn.style.display = 'none';
        } else if (s.detailsSubmitted) {
          stripeMessage.innerHTML = '⏳ <strong>Vérification en cours</strong> par Stripe.';
          stripeBtn.textContent = 'Compléter mes informations';
          stripeBtn.style.display = 'inline-flex';
          stripeDashBtn.style.display = 'none';
        } else {
          stripeMessage.innerHTML = '⚠️ Complétez votre inscription Stripe pour activer les paiements.';
          stripeBtn.textContent = 'Activer mes paiements';
          stripeBtn.style.display = 'inline-flex';
          stripeDashBtn.style.display = 'none';
        }
      } catch (e) {
        stripeMessage.textContent = 'Erreur : ' + e.message;
      }
    }

    stripeBtn.onclick = async () => {
      try {
        const { url } = await api.post('/connect/onboard');
        location.href = url;
      } catch (e) {
        showAlert(alertBox, e.message);
      }
    };

    stripeDashBtn.onclick = async () => {
      try {
        const { url } = await api.post('/connect/dashboard');
        window.open(url, '_blank');
      } catch (e) {
        showAlert(alertBox, e.message);
      }
    };

    loadStripeStatus();

    const params = new URLSearchParams(location.search);
    if (params.get('stripe') === 'ok') {
      showAlert(alertBox, '✓ Informations enregistrées. Vérification en cours.', 'success');
      setTimeout(loadStripeStatus, 1500);
    }
    if (params.get('stripe') === 'refresh') {
      showAlert(alertBox, 'Session expirée, veuillez réessayer.', 'error');
    }

    // ---- Aperçu prix ----
    priceInput.oninput = () => {
      const v = parseInt(priceInput.value);
      pricePreview.textContent = v > 0
        ? `= ${new Intl.NumberFormat('fr-FR').format(v)} FCFA`
        : '';
    };

    // ---- Aperçu image ----
    const fileInput = form.querySelector('input[name="image"]');
    fileInput.onchange = () => {
      preview.innerHTML = '';
      const file = fileInput.files[0];
      if (!file) return;
      if (file.size > 3 * 1024 * 1024) {
        showAlert(alertBox, 'Image trop lourde (3 Mo max)');
        fileInput.value = '';
        return;
      }
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    };

    // ---- Stats ----
    async function loadStats(products) {
      const activeCount = products.filter(p => p.stock > 0).length;
      const outOfStock = products.filter(p => p.stock === 0).length;
      const totalValue = products.reduce((s, p) => s + p.price * p.stock, 0);

      statsGrid.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Produits</div>
          <div class="stat-value">${products.length}</div>
          <div class="stat-sub">${activeCount} en stock · ${outOfStock} épuisé${outOfStock > 1 ? 's' : ''}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Valeur du stock</div>
          <div class="stat-value">${formatPrice(totalValue)}</div>
          <div class="stat-sub">Inventaire total</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Statut Stripe</div>
          <div class="stat-value" id="stripeStatValue">…</div>
          <div class="stat-sub">Paiements automatiques</div>
        </div>
      `;
    }

    // ---- Liste produits ----
    async function loadProducts() {
      const products = await api.get(`/products?vendorId=${me.vendor.id}`);

      countEl.textContent = products.length
        ? `${products.length} produit${products.length > 1 ? 's' : ''}`
        : '';

      shopStats.textContent = products.length
        ? `${products.length} produit${products.length > 1 ? 's' : ''} en ligne`
        : 'Aucun produit pour le moment';

      loadStats(products);

      if (!products.length) {
        list.innerHTML = `
          <div class="empty">
            <div class="empty-icon">📦</div>
            <h3 style="margin-bottom:6px">Aucun produit</h3>
            <p class="muted">Créez votre premier produit avec le formulaire.</p>
          </div>
        `;
        return;
      }

      list.innerHTML = `
        <div class="product-list">
          ${products.map(p => `
            <div class="product-row">
              <img src="${p.imageUrl || 'https://picsum.photos/seed/' + p.id + '/80'}"
                   alt="${p.title}" />
              <div class="product-row-info">
                <div class="product-row-title">${p.title}</div>
                <div class="product-row-meta">
                  ${p.category ? `<span class="badge-cat">${p.category}</span>` : ''}
                  <span class="muted">${formatPrice(p.price)}</span>
                </div>
              </div>
              <div class="product-row-stock ${p.stock > 0 ? 'stock-ok' : 'stock-out'}">
                ${p.stock > 0 ? `${p.stock} en stock` : 'Épuisé'}
              </div>
              <button class="btn btn-danger btn-xs" data-id="${p.id}">Supprimer</button>
            </div>
          `).join('')}
        </div>
      `;

      list.querySelectorAll('button[data-id]').forEach(btn => {
        btn.onclick = async () => {
          if (!confirm('Supprimer ce produit ?')) return;
          try {
            await api.delete(`/products/${btn.dataset.id}`);
            loadProducts();
          } catch (e) { showAlert(alertBox, e.message); }
        };
      });
    }

    // ---- Créer produit ----
    form.onsubmit = async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Envoi…';

      try {
        let imageUrl = null;
        const file = fileInput.files[0];
        if (file) {
          const fdImg = new FormData();
          fdImg.append('image', file);
          const res = await fetch('/api/upload', {
            method: 'POST',
            body: fdImg,
            credentials: 'include',
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Erreur upload');
          imageUrl = data.url;
        }

        const fd = new FormData(form);
        await api.post('/products', {
          title: fd.get('title'),
          description: fd.get('description'),
          price: parseInt(fd.get('price')),
          stock: parseInt(fd.get('stock') || 0),
          category: fd.get('category') || null,
          imageUrl,
        });

        showAlert(alertBox, '✓ Produit publié !', 'success');
        form.reset();
        preview.innerHTML = '';
        pricePreview.textContent = '';
        loadProducts();
      } catch (e) {
        showAlert(alertBox, e.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Publier le produit';
      }
    };

    loadProducts();
  </script>
</body>
</html>
